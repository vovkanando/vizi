<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Электронная визитка</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="wrap"><div id="card" class="card"><div class="body" style="color:#fff">Загрузка…</div></div></div>
<script src="/shared.js"></script>
<script>
var slug=decodeURIComponent((location.pathname.match(/^\/c\/([^\/]+)/)||[])[1]||"").toLowerCase();
function nf(){$("card").innerHTML='<div class="body" style="color:#fff"><h3>Визитка не найдена</h3><p>Проверьте адрес ссылки.</p></div>'}
if(!/^[a-z0-9-]{3,32}$/.test(slug)){nf()}else{
fetch(CFG.SB+"/rest/v1/rpc/get_card",{method:"POST",headers:{apikey:CFG.KEY,"Content-Type":"application/json"},body:JSON.stringify({p_slug:slug})})
.then(function(r){return r.json()})
.then(function(d){if(!d||typeof d!=="object"||d.code||d.message){nf();return}document.title=(d.n||"Визитка");renderCard(d,slug,$("card"))})
.catch(nf)}
</script>
</body>
</html>
